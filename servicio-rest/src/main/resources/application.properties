spring.application.name=aniflex-rest
server.port=8081
server.address=127.0.0.1
aniflex.mongodb.uri=${ANIFLEX_MONGODB_URI:mongodb://localhost:27017}
aniflex.mongodb.database=${ANIFLEX_MONGODB_DATABASE:Aniflex_C}
aniflex.mongodb.timeout-segundos=3

# Prototipo desechable: vacía las colecciones propias al iniciar y detener Spring.
aniflex.prototipo.limpiar=true
# Misma clave local en ambos servicios para la baja interna coordinada.
aniflex.integracion.clave=${ANIFLEX_INTEGRACION_CLAVE:aniflex-prototipo-local}

# Consulta el catálogo de GraphQL por HTTP, nunca mediante su base MongoDB.
aniflex.graphql.url=${ANIFLEX_GRAPHQL_URL:http://localhost:8080}
